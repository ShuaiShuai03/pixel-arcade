name: Release

# Pushing a `v*` tag builds every platform and publishes a GitHub Release.
# Running it manually (workflow_dispatch) only builds and uploads artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: Build universal macOS binary
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/pixel_parkour \
            target/x86_64-apple-darwin/release/pixel_parkour \
            target/aarch64-apple-darwin/release/pixel_parkour
          lipo -info target/release/pixel_parkour

      - name: Package
        shell: bash
        run: |
          pkg="pixel-parkour-${{ matrix.name }}"
          mkdir "$pkg"
          cp README.md LICENSE LICENSE-ARK-PIXEL-FONT.txt "$pkg/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/pixel_parkour.exe "$pkg/"
            7z a "$pkg.zip" "$pkg" > /dev/null
          else
            cp target/release/pixel_parkour "$pkg/"
            zip -r "$pkg.zip" "$pkg" > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-parkour-${{ matrix.name }}
          path: pixel-parkour-${{ matrix.name }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pixel-parkour-*.zip \
            --repo "$GITHUB_REPOSITORY" --title "Pixel Parkour $GITHUB_REF_NAME" --generate-notes
